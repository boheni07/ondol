  <rect x="16" y="760" width="358" height="48" rx="10" fill="#F0F8FA"/>
  <text x="32" y="784" font-family="Arial" font-size="11" fill="#3B7D8E">♿ 탭 영역 최소 80×80px · 텍스트 20px 이상 · 고대비</text>
  <text x="32" y="800" font-family="Arial" font-size="11" fill="#3B7D8E">버튼 56×56px 이상 · 음성 안내 지원 (TalkBack/VoiceOver)</text>
