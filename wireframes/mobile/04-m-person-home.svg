  <!-- Home active -->
  <text x="78" y="679" text-anchor="middle" font-family="Arial" font-size="22" fill="#E8724A">🏠</text>
  <text x="78" y="706" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E8724A">홈</text>
  <rect x="60" y="660" width="36" height="3" rx="1.5" fill="#E8724A"/>
  <!-- Self expression -->
  <text x="195" y="679" text-anchor="middle" font-family="Arial" font-size="22" fill="#9CA3AF">😊</text>
  <text x="195" y="706" text-anchor="middle" font-family="Arial" font-size="12" fill="#9CA3AF">기분 기록</text>
