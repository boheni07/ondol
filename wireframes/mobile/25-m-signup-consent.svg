  <text x="238" y="304" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#C0362C">필수</text>
  <text x="370" y="305" text-anchor="end" font-family="Arial" font-size="12" fill="#3B7D8E">전문 ›</text>

