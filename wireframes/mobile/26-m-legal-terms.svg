<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- A-09 · ST-03 Legal Terms (PolicyViewer) · Mobile 390×844 -->
  <text x="8" y="12" font-family="Arial" font-size="9" fill="#9CA3AF">A-09 · ST-03 Legal Terms · Mobile 390×844</text>
  <rect width="390" height="844" fill="#FFFFFF"/>
  <rect width="390" height="844" rx="0" fill="none" stroke="#E5E7EB"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#FFFFFF"/>
  <text x="20" y="30" font-family="Arial" font-size="13" font-weight="bold" fill="#111827">9:41</text>
  <text x="340" y="30" font-family="Arial" font-size="12" fill="#111827">● ●● ■■■</text>

  <!-- Nav bar (push) -->
  <rect y="44" width="390" height="56" fill="#FFFFFF"/>
  <line y1="100" x1="0" y2="100" x2="390" stroke="#E5E7EB"/>
  <text x="20" y="78" font-family="Arial" font-size="22" fill="#374151">←</text>
  <text x="195" y="80" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">이용약관</text>

  <!-- version + date -->
  <rect x="20" y="116" width="350" height="56" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <rect x="36" y="130" width="64" height="24" rx="6" fill="#EEF4FD"/>
  <text x="68" y="147" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2E5FA8">버전 v1.2</text>
  <text x="112" y="139" font-family="Arial" font-size="11" fill="#6B7280">시행일 2026-06-01</text>
  <text x="112" y="158" font-family="Arial" font-size="11" fill="#6B7280">내가 동의한 일시 2026-06-14 14:32</text>

  <!-- TOC accordion (collapsed) -->
  <rect x="20" y="184" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="211" font-family="Arial" font-size="13" font-weight="bold" fill="#374151">목차 (조항 점프)</text>
  <text x="354" y="211" text-anchor="end" font-family="Arial" font-size="14" fill="#6B7280">▾</text>

  <!-- Article body -->
  <text x="20" y="266" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">제1조 (목적)</text>
  <text x="20" y="292" font-family="Arial" font-size="13" fill="#374151">이 약관은 주식회사 온돌(이하 "회사")이</text>
  <text x="20" y="314" font-family="Arial" font-size="13" fill="#374151">제공하는 발달장애인 생애기록 통합 관리</text>
  <text x="20" y="336" font-family="Arial" font-size="13" fill="#374151">서비스의 이용과 관련하여 회사와 이용자</text>
  <text x="20" y="358" font-family="Arial" font-size="13" fill="#374151">간의 권리·의무를 규정함을 목적으로 합니다.</text>

  <text x="20" y="402" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">제2조 (용어의 정의)</text>
  <text x="20" y="428" font-family="Arial" font-size="13" fill="#374151">1. "당사자"란 생애기록이 관리되는</text>
  <text x="20" y="450" font-family="Arial" font-size="13" fill="#374151">   발달장애인 본인을 말합니다.</text>
  <text x="20" y="472" font-family="Arial" font-size="13" fill="#374151">2. "보호자"란 당사자를 대리하여 계정과</text>
  <text x="20" y="494" font-family="Arial" font-size="13" fill="#374151">   권한을 관리하는 가족·후견인을 말합니다.</text>
  <text x="20" y="516" font-family="Arial" font-size="13" fill="#374151">3. "이해관계자"란 보호자가 권한을 부여한</text>
  <text x="20" y="538" font-family="Arial" font-size="13" fill="#374151">   전문가(교사·복지사 등)를 말합니다.</text>

  <text x="20" y="582" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">제3조 (약관의 효력 및 변경)</text>
  <text x="20" y="608" font-family="Arial" font-size="13" fill="#374151">회사는 약관을 변경할 경우 시행일 7일 전</text>
  <text x="20" y="630" font-family="Arial" font-size="13" fill="#374151">(불리한 변경은 30일 전)부터 공지하며,</text>
  <text x="20" y="652" font-family="Arial" font-size="13" fill="#374151">동의 버전과 다를 경우 재동의를 요청합니다.</text>
  <text x="20" y="692" font-family="Arial" font-size="12" fill="#9CA3AF">… 이하 본문 계속 (스크롤) …</text>

  <!-- Sticky footer back -->
  <line y1="724" x1="0" y2="724" x2="390" stroke="#E5E7EB"/>
  <rect x="20" y="736" width="350" height="52" rx="12" fill="#FFFFFF" stroke="#3B7D8E" stroke-width="2"/>
  <text x="195" y="768" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#3B7D8E">← 동의 화면으로 돌아가기</text>

  <!-- Bottom safe area -->
  <rect y="800" width="390" height="44" fill="#FFFFFF"/>
  <rect x="155" y="820" width="80" height="5" rx="2.5" fill="#D1D5DB"/>
</svg>
