<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- P-23 · ST-11 Accessible · Person Consent &amp; Rights · Mobile 390×844 (대형 UI·쉬운 언어) -->
  <text x="8" y="12" font-family="Arial" font-size="9" fill="#9CA3AF">P-23 · ST-11 Accessible · Person Consent · Mobile 390×844 (대형 UI)</text>
  <rect width="390" height="844" fill="#FFFFFF"/>
  <rect width="390" height="844" rx="0" fill="none" stroke="#E5E7EB"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#FFFFFF"/>
  <text x="20" y="30" font-family="Arial" font-size="13" font-weight="bold" fill="#000000">9:41</text>
  <text x="340" y="30" font-family="Arial" font-size="12" fill="#000000">● ●● ■■■</text>

  <!-- Nav bar (large) -->
  <rect y="44" width="390" height="64" fill="#FFFFFF"/>
  <line y1="108" x1="0" y2="108" x2="390" stroke="#E5E7EB"/>
  <text x="20" y="86" font-family="Arial" font-size="26" fill="#C4500A">←</text>
  <text x="195" y="86" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#000000">내 정보 동의</text>

  <!-- 안내 박스 -->
  <rect x="16" y="124" width="358" height="72" rx="16" fill="#FFF7ED" stroke="#F5C982" stroke-width="2"/>
  <text x="32" y="156" font-family="Arial" font-size="16" fill="#92670D">💡 어려우면 도와주는 사람에게</text>
  <text x="32" y="180" font-family="Arial" font-size="16" fill="#92670D">물어봐도 괜찮아요.</text>

  <!-- Card 1: 서비스 약관 (동의함 ●) -->
  <rect x="16" y="212" width="358" height="96" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="32" y="248" font-family="Arial" font-size="20" font-weight="bold" fill="#000000">서비스 약관</text>
  <text x="32" y="276" font-family="Arial" font-size="15" fill="#374151">온돌을 쓰려면 꼭 필요해요</text>
  <rect x="32" y="288" width="142" height="44" rx="22" fill="#E7F6EF" stroke="#22A06B" stroke-width="2"/>
  <circle cx="60" cy="288" r="0" fill="none"/>
  <circle cx="58" cy="310" r="10" fill="#22A06B"/>
  <text x="116" y="316" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1A7A50">동의함 ●</text>

  <!-- Card 2: 새 소식 받기 (큰 ●/○ 두 버튼) -->
  <rect x="16" y="324" width="358" height="132" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="32" y="360" font-family="Arial" font-size="20" font-weight="bold" fill="#000000">새 소식 받기</text>
  <text x="32" y="388" font-family="Arial" font-size="15" fill="#374151">받기 싫으면 ‘안 함’으로 바꿔요</text>
  <rect x="32" y="404" width="158" height="44" rx="22" fill="#FDEFE9" stroke="#C4500A" stroke-width="3"/>
  <circle cx="62" cy="426" r="10" fill="#C4500A"/>
  <text x="122" y="432" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#C4500A">동의함</text>
  <rect x="200" y="404" width="158" height="44" rx="22" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <circle cx="230" cy="426" r="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="290" y="432" text-anchor="middle" font-family="Arial" font-size="16" fill="#6B7280">안 함</text>

  <!-- Card 3: 건강·장애 정보 (동의함 + 큰 철회) -->
  <rect x="16" y="472" width="358" height="148" rx="20" fill="#FFFFFF" stroke="#F5C982" stroke-width="2"/>
  <text x="32" y="508" font-family="Arial" font-size="20" font-weight="bold" fill="#000000">건강·장애 정보 쓰기</text>
  <text x="32" y="536" font-family="Arial" font-size="15" fill="#374151">‘안 함’으로 바꾸면 일부 기록을</text>
  <text x="32" y="558" font-family="Arial" font-size="15" fill="#374151">볼 수 없어요. 한 번 더 물어봐요.</text>
  <rect x="32" y="572" width="142" height="44" rx="22" fill="#E7F6EF" stroke="#22A06B" stroke-width="2"/>
  <circle cx="58" cy="594" r="10" fill="#22A06B"/>
  <text x="116" y="600" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1A7A50">동의함 ●</text>
  <rect x="186" y="572" width="172" height="44" rx="14" fill="#FFFFFF" stroke="#BF3030" stroke-width="3"/>
  <text x="272" y="600" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#BF3030">안 함으로 바꾸기</text>

  <!-- Card 4: 내 정보 가져오기 (큰 버튼) -->
  <rect x="16" y="636" width="358" height="116" rx="20" fill="#EEF4FD" stroke="#A8C4E4" stroke-width="2"/>
  <text x="32" y="672" font-family="Arial" font-size="20" font-weight="bold" fill="#000000">내 정보 가져오기</text>
  <text x="32" y="700" font-family="Arial" font-size="15" fill="#374151">내 기록을 파일로 받아요</text>
  <rect x="32" y="712" width="326" height="56" rx="14" fill="#3B7D8E"/>
  <text x="195" y="746" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="white">파일로 받기</text>

  <!-- Bottom safe area -->
  <rect y="800" width="390" height="44" fill="#FFFFFF"/>
  <rect x="155" y="820" width="80" height="5" rx="2.5" fill="#D1D5DB"/>
</svg>
