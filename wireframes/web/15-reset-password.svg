<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- A-07 · ST-09 Password Reset · Web 1440×900 -->
  <text x="8" y="14" font-family="Arial" font-size="10" fill="#9CA3AF">A-07 · ST-09 Reset Password · Web 1440×900</text>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Top bar -->
  <rect width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1440" y2="64" stroke="#E5E7EB"/>
  <text x="40" y="42" font-family="Arial" font-size="20" font-weight="bold" fill="#3B7D8E">온돌</text>
  <text x="86" y="42" font-family="Arial" font-size="13" fill="#6B7280">OnDol</text>

  <!-- Card -->
  <rect x="460" y="180" width="520" height="500" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Icon -->
  <circle cx="720" cy="252" r="40" fill="#EEF4FD"/>
  <text x="720" y="265" text-anchor="middle" font-family="Arial" font-size="32" fill="#3B7D8E">🔑</text>

  <!-- Title -->
  <text x="720" y="328" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#111827">비밀번호 재설정</text>
  <text x="720" y="354" text-anchor="middle" font-family="Arial" font-size="13" fill="#6B7280">가입 시 사용한 이메일을 입력하시면 재설정 링크를 보내드립니다</text>

  <!-- Email input -->
  <text x="500" y="404" font-family="Arial" font-size="13" font-weight="bold" fill="#374151">이메일</text>
  <rect x="500" y="414" width="440" height="48" rx="10" fill="#FFFFFF" stroke="#3B7D8E" stroke-width="2"/>
  <text x="518" y="442" font-family="Arial" font-size="14" fill="#111827">guardian@example.com</text>

  <!-- Send button -->
  <rect x="500" y="486" width="440" height="52" rx="10" fill="#3B7D8E"/>
  <text x="720" y="518" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="white">재설정 링크 보내기</text>

  <!-- Info box -->
  <rect x="500" y="556" width="440" height="68" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="518" y="580" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">📌 안내</text>
  <text x="518" y="600" font-family="Arial" font-size="11" fill="#6B7280">메일이 오지 않으면 스팸함을 확인해 주세요</text>
  <text x="518" y="614" font-family="Arial" font-size="11" fill="#6B7280">재설정 링크는 발송 후 30분간 유효합니다</text>

  <!-- Back -->
  <text x="720" y="654" text-anchor="middle" font-family="Arial" font-size="13" fill="#3B7D8E">← 로그인 화면으로 돌아가기</text>
</svg>
