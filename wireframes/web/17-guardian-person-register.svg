  <text x="392" y="772" font-family="Arial" font-size="13" font-weight="bold" fill="#374151">의사소통 방법</text>
  <g>
    <rect x="392" y="782" width="120" height="36" rx="18" fill="#EEF4FD" stroke="#3B7D8E" stroke-width="1.5"/>
    <text x="452" y="804" text-anchor="middle" font-family="Arial" font-size="12" fill="#2E5FA8">단어 ✓</text>
    <rect x="524" y="782" width="120" height="36" rx="18" fill="#EEF4FD" stroke="#3B7D8E" stroke-width="1.5"/>
    <text x="584" y="804" text-anchor="middle" font-family="Arial" font-size="12" fill="#2E5FA8">그림카드 ✓</text>
    <rect x="656" y="782" width="120" height="36" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="716" y="804" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7280">수어</text>
    <rect x="788" y="782" width="120" height="36" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="848" y="804" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7280">AAC</text>
    <rect x="920" y="782" width="120" height="36" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="980" y="804" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7280">제스처</text>
