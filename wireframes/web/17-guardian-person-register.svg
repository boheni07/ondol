    <line x1="990" y1="104" x2="1182" y2="104" stroke="#E5E7EB" stroke-width="2"/>

    <circle cx="1200" cy="104" r="14" fill="#E5E7EB"/><text x="1200" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">5</text>
    <text x="1200" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">확인</text>
