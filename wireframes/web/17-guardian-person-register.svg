  <text x="1408" y="40" text-anchor="end" font-family="Arial" font-size="13" fill="#9CA3AF">취소</text>

  <!-- Step indicator bar -->
  <rect x="64" y="64" width="1376" height="80" fill="#FFFFFF"/>
  <line x1="64" y1="144" x2="1440" y2="144" stroke="#E5E7EB"/>
  <g>
    <circle cx="288" cy="104" r="14" fill="#3B7D8E"/><text x="288" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="white">✓</text>
    <text x="288" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">기본 정보</text>
    <line x1="306" y1="104" x2="498" y2="104" stroke="#3B7D8E" stroke-width="2"/>

    <circle cx="516" cy="104" r="14" fill="#3B7D8E"/><text x="516" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="white">✓</text>
    <text x="516" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">장애 정보</text>
    <line x1="534" y1="104" x2="726" y2="104" stroke="#3B7D8E" stroke-width="2"/>

    <circle cx="744" cy="104" r="14" fill="#3B7D8E"/><text x="744" y="109" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">3</text>
    <text x="744" y="134" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#3B7D8E">응급 정보</text>
    <line x1="762" y1="104" x2="954" y2="104" stroke="#E5E7EB" stroke-width="2"/>

    <circle cx="972" cy="104" r="14" fill="#E5E7EB"/><text x="972" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">4</text>
