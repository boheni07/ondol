  <rect x="392" y="588" width="350" height="48" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="408" y="616" font-family="Arial" font-size="13" fill="#111827">김보호자 (모)</text>
  <rect x="762" y="588" width="350" height="48" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="778" y="616" font-family="Arial" font-size="13" fill="#111827">010-1234-5678</text>

  <text x="392" y="678" font-family="Arial" font-size="13" font-weight="bold" fill="#374151">비상연락처 2순위</text>
  <rect x="392" y="688" width="350" height="48" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="408" y="716" font-family="Arial" font-size="13" fill="#9CA3AF">이름·관계</text>
  <rect x="762" y="688" width="350" height="48" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="778" y="716" font-family="Arial" font-size="13" fill="#9CA3AF">010-0000-0000</text>

