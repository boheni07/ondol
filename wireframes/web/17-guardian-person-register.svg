  <text x="513" y="318" text-anchor="middle" font-family="Arial" font-size="11" fill="#BF3030">새우 ×</text>
  <text x="554" y="318" font-family="Arial" font-size="13" fill="#9CA3AF">입력 후 Enter로 태그 추가...</text>

  <!-- Forbidden medications -->
  <text x="392" y="378" font-family="Arial" font-size="13" font-weight="bold" fill="#374151">금기 약물 <tspan fill="#E04545">*</tspan></text>
