    <text x="372" y="396" font-family="Arial" font-size="11" fill="#6B7280">진단·진료·치료·약물 (MED-001~007)</text>
    <text x="372" y="424" font-family="Arial" font-size="11" fill="#BF3030">언어치료 회기 기록에 필요</text>
    <rect x="676" y="358" width="28" height="28" rx="6" fill="#BF3030"/>
    <text x="690" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>

    <!-- Education (unchecked) -->
    <rect x="736" y="346" width="408" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="770" cy="380" r="14" fill="#2E5FA8"/>
    <text x="770" y="386" text-anchor="middle" font-family="Arial" font-size="14" fill="white">B</text>
    <text x="796" y="376" font-family="Arial" font-size="15" font-weight="bold" fill="#111827">교육</text>
    <text x="796" y="396" font-family="Arial" font-size="11" fill="#6B7280">IEP·관찰·평가 (EDU-001~007)</text>
    <rect x="1100" y="358" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>

    <!-- Welfare (unchecked) -->
    <rect x="312" y="458" width="408" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="346" cy="492" r="14" fill="#276B4C"/>
    <text x="346" y="498" text-anchor="middle" font-family="Arial" font-size="14" fill="white">C</text>
    <text x="372" y="488" font-family="Arial" font-size="15" font-weight="bold" fill="#111827">복지서비스</text>
    <text x="372" y="508" font-family="Arial" font-size="11" fill="#6B7280">ISP·서비스 이용 (WEL-001~006)</text>
    <rect x="676" y="470" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>

    <!-- Daily -->
    <rect x="736" y="458" width="408" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="770" cy="492" r="14" fill="#B56F10"/>
    <text x="770" y="498" text-anchor="middle" font-family="Arial" font-size="14" fill="white">D</text>
    <text x="796" y="488" font-family="Arial" font-size="15" font-weight="bold" fill="#111827">일상/돌봄</text>
    <text x="796" y="508" font-family="Arial" font-size="11" fill="#6B7280">활동지원 일지 (DAI-001~003)</text>
    <rect x="1100" y="470" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>

    <!-- Transition -->
    <rect x="312" y="570" width="408" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="346" cy="604" r="14" fill="#6A43A8"/>
    <text x="346" y="610" text-anchor="middle" font-family="Arial" font-size="14" fill="white">E</text>
    <text x="372" y="600" font-family="Arial" font-size="15" font-weight="bold" fill="#111827">전환/자립</text>
    <text x="372" y="620" font-family="Arial" font-size="11" fill="#6B7280">전환계획·취업·주거 (TRA-001~003)</text>
    <rect x="676" y="582" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>

    <!-- Legal -->
    <rect x="736" y="570" width="408" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="770" cy="604" r="14" fill="#3E5E7A"/>
    <text x="770" y="610" text-anchor="middle" font-family="Arial" font-size="14" fill="white">F</text>
    <text x="796" y="600" font-family="Arial" font-size="15" font-weight="bold" fill="#111827">법적/행정</text>
    <text x="796" y="620" font-family="Arial" font-size="11" fill="#6B7280">후견·재정·동의서 (LEG-001~003)</text>
    <rect x="1100" y="582" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
