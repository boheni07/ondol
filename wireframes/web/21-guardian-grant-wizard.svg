  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Sidebar collapsed -->
  <rect width="64" height="900" fill="#F5F5F5"/>
  <rect width="64" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="64" y2="64" stroke="#E5E7EB"/>
  <text x="32" y="42" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#3B7D8E">온</text>

  <!-- Header -->
  <rect x="64" width="1376" height="64" fill="#FFFFFF"/><line x1="64" y1="64" x2="1440" y2="64" stroke="#E5E7EB"/>
  <text x="96" y="40" font-family="Arial" font-size="13" fill="#6B7280">권한 관리 / <tspan fill="#111827" font-weight="bold">+ 권한 부여</tspan></text>
  <text x="1408" y="40" text-anchor="end" font-family="Arial" font-size="13" fill="#9CA3AF">취소</text>

  <!-- Step indicator -->
  <rect x="64" y="64" width="1376" height="80" fill="#FFFFFF"/>
  <line x1="64" y1="144" x2="1440" y2="144" stroke="#E5E7EB"/>
  <g>
    <circle cx="448" cy="104" r="14" fill="#3B7D8E"/><text x="448" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="white">✓</text>
    <text x="448" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">대상자 선택</text>
    <line x1="466" y1="104" x2="710" y2="104" stroke="#3B7D8E" stroke-width="2"/>

    <circle cx="728" cy="104" r="14" fill="#3B7D8E"/><text x="728" y="109" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">2</text>
    <text x="728" y="134" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#3B7D8E">분야 선택</text>
    <line x1="746" y1="104" x2="990" y2="104" stroke="#E5E7EB" stroke-width="2"/>

    <circle cx="1008" cy="104" r="14" fill="#E5E7EB"/><text x="1008" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">3</text>
    <text x="1008" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">수준 · 기간</text>
    <line x1="1026" y1="104" x2="1270" y2="104" stroke="#E5E7EB" stroke-width="2"/>

    <circle cx="1288" cy="104" r="14" fill="#E5E7EB"/><text x="1288" y="109" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">4</text>
    <text x="1288" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#6B7280">미리보기</text>
  </g>

  <!-- Selected person & inviter info -->
  <rect x="280" y="172" width="880" height="60" rx="10" fill="#FFF8F4" stroke="#FACDB8"/>
  <circle cx="312" cy="202" r="18" fill="#E8724A"/>
  <text x="312" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="white">이</text>
  <text x="344" y="198" font-family="Arial" font-size="13" font-weight="bold" fill="#111827">관리 대상: 이온돌 (20세)</text>
  <text x="344" y="216" font-family="Arial" font-size="11" fill="#6B7280">자폐성 장애 2급 · 성인전환기</text>
