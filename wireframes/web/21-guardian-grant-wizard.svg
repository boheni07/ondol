  <text x="312" y="290" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">어떤 분야의 기록 권한을 부여할까요?</text>
  <text x="312" y="314" font-family="Arial" font-size="13" fill="#6B7280">여러 분야를 선택할 수 있습니다. 분야별로 수준은 다음 단계에서 설정합니다</text>

  <g>
