    <rect x="312" y="346" width="408" height="100" rx="12" fill="#FEF0F0" stroke="#BF3030" stroke-width="2"/>
    <circle cx="346" cy="380" r="14" fill="#BF3030"/>
    <text x="346" y="386" text-anchor="middle" font-family="Arial" font-size="14" fill="white">A</text>
