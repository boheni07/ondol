    <rect x="692" y="510" width="120" height="36" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="752" y="532" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7280">+ AAC</text>
