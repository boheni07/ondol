  <rect x="1244" y="16" width="84" height="32" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="1286" y="36" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">⬇ PDF</text>
  <rect x="1336" y="16" width="72" height="32" rx="6" fill="#3B7D8E"/>
  <text x="1372" y="36" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">확인</text>

