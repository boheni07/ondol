  <text x="272" y="364" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">📌 핵심 요약</text>
  <rect x="272" y="376" width="1136" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="296" y="406" font-family="Arial" font-size="13" fill="#111827">- 자폐성 장애 2급, 의사소통은 단어+그림카드(PECS)로 가능</text>
  <text x="296" y="428" font-family="Arial" font-size="13" fill="#111827">- 평소 패턴: 13:00-17:00 가정 도착, 산책/외출 선호</text>
  <text x="296" y="450" font-family="Arial" font-size="13" fill="#111827">- 직업재활시설(오전) 후 오후 활동지원 진행</text>
  <text x="296" y="472" font-family="Arial" font-size="13" font-weight="bold" fill="#BF3030">- ⚠ 큰 소음/일정 변경 시 불안 증가 → 미리 그림카드로 예고</text>

