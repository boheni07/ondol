  <text x="296" y="124" font-family="Arial" font-size="12" font-weight="bold" fill="#2E5FA8">📋 활동지원 인계</text>
  <text x="296" y="156" font-family="Arial" font-size="24" font-weight="bold" fill="#111827">이온돌 — 2026년 6월 활동지원 인계</text>
  <text x="296" y="180" font-family="Arial" font-size="13" fill="#374151">담당 기간: 2026.06.01 ~ 2026.11.30 (6개월) · 분야: 일상/돌봄</text>
  <text x="296" y="200" font-family="Arial" font-size="12" fill="#6B7280">전임: 김지원사 (010-5555-1111) → 후임: 박지원 (본인) · 작성 2026-06-08</text>

  <!-- Predecessor/successor row -->
  <rect x="272" y="232" width="556" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="296" y="258" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">⬅ 전임자</text>
  <circle cx="312" cy="294" r="20" fill="#9CA3AF"/>
  <text x="312" y="300" text-anchor="middle" font-family="Arial" font-size="13" fill="white">김</text>
