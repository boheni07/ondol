    <text x="316" y="570" font-family="Arial" font-size="13" font-weight="bold" fill="#111827">땅콩 알레르기 (호흡곤란 가능)</text>
    <text x="316" y="588" font-family="Arial" font-size="11" fill="#6B7280">에피펜은 가방 앞 포켓에 항상 휴대</text>

    <rect x="288" y="610" width="20" height="20" rx="4" fill="#E8724A"/>
