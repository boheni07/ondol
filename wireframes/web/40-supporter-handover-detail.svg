    <text x="936" y="696" font-family="Arial" font-size="12" font-weight="bold" fill="#111827">5월 활동지원 일지 (전임 작성)</text>
    <line x1="876" y1="708" x2="1388" y2="708" stroke="#F3F4F6"/>

    <text x="876" y="728" font-family="Arial" font-size="11" fill="#9CA3AF">전환</text>
