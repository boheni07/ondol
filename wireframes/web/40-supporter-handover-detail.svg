    <text x="316" y="642" font-family="Arial" font-size="11" fill="#6B7280">노이즈 캔슬링 이어폰 휴대 권장</text>

    <rect x="288" y="664" width="20" height="20" rx="4" fill="#B56F10"/>
    <text x="298" y="680" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">!</text>
    <text x="316" y="678" font-family="Arial" font-size="13" font-weight="bold" fill="#111827">루틴 유지 중요</text>
    <text x="316" y="696" font-family="Arial" font-size="11" fill="#6B7280">월/수/금 도서관, 화/목 공원 산책</text>

    <rect x="288" y="718" width="20" height="20" rx="4" fill="#3B7D8E"/>
    <text x="298" y="734" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">!</text>
    <text x="316" y="732" font-family="Arial" font-size="13" font-weight="bold" fill="#111827">선호 활동: 음악·자동차</text>
    <text x="316" y="750" font-family="Arial" font-size="11" fill="#6B7280">스트레스 시 음악 들려주면 진정됨</text>
  </g>

