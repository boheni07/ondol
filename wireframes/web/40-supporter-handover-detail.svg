  <text x="344" y="310" font-family="Arial" font-size="12" fill="#6B7280">전 활동지원사 · 8개월 담당</text>

  <rect x="852" y="232" width="556" height="100" rx="12" fill="#FFF5E6" stroke="#F2C94C"/>
  <text x="876" y="258" font-family="Arial" font-size="12" font-weight="bold" fill="#92670D">➡ 후임자 (본인)</text>
