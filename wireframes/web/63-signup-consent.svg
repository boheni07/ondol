<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- A-08 · ST-09 Signup Consent · Web 1440×900 -->
  <text x="8" y="14" font-family="Arial" font-size="10" fill="#9CA3AF">A-08 · ST-09 Signup · Consent Collection · Web 1440×900</text>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Top brand bar -->
  <rect width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1440" y2="64" stroke="#E5E7EB"/>
  <text x="40" y="42" font-family="Arial" font-size="20" font-weight="bold" fill="#3B7D8E">온돌</text>
  <text x="86" y="42" font-family="Arial" font-size="13" fill="#6B7280">OnDol</text>
  <text x="1400" y="42" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">로그인</text>

  <!-- Step indicator (3/3) -->
  <text x="720" y="116" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7280">STEP 3 / 3 · 약관 동의</text>
  <line x1="540" y1="134" x2="900" y2="134" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="540" y1="134" x2="900" y2="134" stroke="#3B7D8E" stroke-width="3"/>
  <circle cx="540" cy="134" r="8" fill="#3B7D8E"/>
  <circle cx="720" cy="134" r="8" fill="#3B7D8E"/>
  <circle cx="900" cy="134" r="8" fill="#3B7D8E"/>

  <!-- Title -->
  <text x="720" y="180" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#111827">약관에 동의해주세요</text>
  <text x="720" y="206" text-anchor="middle" font-family="Arial" font-size="13" fill="#6B7280">항목별로 따로 동의를 받습니다. 필수 항목에 동의해야 가입이 완료됩니다.</text>

  <!-- Form card -->
  <rect x="370" y="236" width="700" height="556" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- 전체 동의 (visual aid only) -->
  <rect x="394" y="260" width="652" height="56" rx="10" fill="#EEF4FD" stroke="#A8C4E4"/>
  <rect x="414" y="278" width="20" height="20" rx="5" fill="#3B7D8E"/>
  <text x="424" y="293" text-anchor="middle" font-family="Arial" font-size="12" fill="white">✓</text>
  <text x="446" y="293" font-family="Arial" font-size="15" font-weight="bold" fill="#2E5FA8">전체 동의 (필수 + 선택)</text>
  <text x="1026" y="293" text-anchor="end" font-family="Arial" font-size="11" fill="#6B7280">개별 항목으로 따로 저장됩니다</text>

  <!-- 필수 그룹 라벨 -->
  <text x="394" y="346" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">필수 동의</text>
  <line x1="460" y1="342" x2="1046" y2="342" stroke="#F3F4F6"/>

  <!-- ConsentItem 1: 이용약관 (required) -->
  <rect x="414" y="360" width="18" height="18" rx="4" fill="#3B7D8E"/>
  <text x="423" y="374" text-anchor="middle" font-family="Arial" font-size="11" fill="white">✓</text>
  <text x="446" y="368" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">이용약관 동의</text>
  <rect x="556" y="356" width="44" height="20" rx="5" fill="#FDECEC"/>
  <text x="578" y="370" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C0362C">필수</text>
  <text x="446" y="386" font-family="Arial" font-size="12" fill="#6B7280">서비스 이용을 위한 기본 약관입니다</text>
  <text x="1026" y="370" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 보기 ›</text>
  <line x1="414" y1="402" x2="1026" y2="402" stroke="#F3F4F6"/>

  <!-- ConsentItem 2: 개인정보(필수) -->
  <rect x="414" y="418" width="18" height="18" rx="4" fill="#3B7D8E"/>
  <text x="423" y="432" text-anchor="middle" font-family="Arial" font-size="11" fill="white">✓</text>
  <text x="446" y="426" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">개인정보 수집·이용 동의</text>
  <rect x="640" y="414" width="44" height="20" rx="5" fill="#FDECEC"/>
  <text x="662" y="428" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C0362C">필수</text>
  <text x="446" y="444" font-family="Arial" font-size="12" fill="#6B7280">이름·이메일·전화번호 (서비스 제공 목적)</text>
  <text x="1026" y="428" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 보기 ›</text>
  <line x1="414" y1="460" x2="1026" y2="460" stroke="#F3F4F6"/>

  <!-- 별도 동의 그룹: 민감 / 고유식별 -->
  <text x="394" y="490" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">별도 동의 (민감정보 · 고유식별정보)</text>
  <rect x="394" y="500" width="652" height="100" rx="10" fill="#FFF7ED" stroke="#F5C982"/>

  <!-- ConsentItem 3: 민감정보 -->
  <rect x="414" y="518" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D1A14A" stroke-width="2"/>
  <text x="446" y="526" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">민감정보 처리 동의 (장애·건강 정보)</text>
  <rect x="700" y="514" width="44" height="20" rx="5" fill="#FEF3C7"/>
  <text x="722" y="528" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#92670D">별도</text>
  <text x="446" y="544" font-family="Arial" font-size="12" fill="#92670D">생애기록의 핵심 기능 제공에 필요합니다 · PIPA §23 별도 동의</text>
  <text x="1026" y="528" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 보기 ›</text>
  <line x1="414" y1="560" x2="1026" y2="560" stroke="#F8E3BD"/>

  <!-- ConsentItem 4: 고유식별정보 (선택) -->
  <rect x="414" y="572" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D1A14A" stroke-width="2"/>
  <text x="446" y="580" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">고유식별정보 처리 동의 (장애인 등록번호)</text>
  <rect x="724" y="568" width="44" height="20" rx="5" fill="#F3F4F6"/>
  <text x="746" y="582" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#6B7280">선택</text>
  <text x="446" y="596" font-family="Arial" font-size="12" fill="#92670D">미동의 시에도 가입 가능 · 추후 설정에서 동의 가능</text>
  <text x="1026" y="582" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 보기 ›</text>

  <!-- 선택 동의 그룹 -->
  <text x="394" y="630" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">선택 동의</text>
  <line x1="460" y1="626" x2="1046" y2="626" stroke="#F3F4F6"/>

  <!-- ConsentItem 5: 마케팅 -->
  <rect x="414" y="646" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="446" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">마케팅·알림 수신 동의</text>
  <rect x="610" y="642" width="44" height="20" rx="5" fill="#F3F4F6"/>
  <text x="632" y="656" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#6B7280">선택</text>
  <text x="446" y="672" font-family="Arial" font-size="12" fill="#6B7280">이벤트·서비스 소식을 이메일/푸시로 받습니다</text>
  <text x="1026" y="656" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 보기 ›</text>

  <!-- 필수 미충족 인라인 예시 (위탁/국외이전 고지) -->
  <rect x="394" y="700" width="652" height="68" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="414" y="726" font-family="Arial" font-size="13" font-weight="bold" fill="#374151">📋 처리위탁·국외이전 고지</text>
  <text x="414" y="748" font-family="Arial" font-size="12" fill="#6B7280">Supabase(미국)·Resend(미국) — 동의가 아닌 고지 사항입니다.</text>
  <text x="1026" y="740" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">고지 보기 ›</text>

  <!-- Buttons -->
  <rect x="370" y="816" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="470" y="848" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">← 뒤로</text>
  <rect x="870" y="816" width="200" height="52" rx="10" fill="#3B7D8E"/>
  <text x="970" y="848" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">가입 완료 →</text>
</svg>
