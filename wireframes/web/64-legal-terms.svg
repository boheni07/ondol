  <!-- Main article (max-w 768) -->
  <rect x="380" y="208" width="1020" height="568" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="412" y="252" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">제1조 (목적)</text>
  <text x="412" y="282" font-family="Arial" font-size="14" fill="#374151">이 약관은 주식회사 온돌(이하 "회사")이 제공하는 발달장애인 생애기록</text>
  <text x="412" y="306" font-family="Arial" font-size="14" fill="#374151">통합 관리 서비스 "온돌"(이하 "서비스")의 이용과 관련하여 회사와</text>
  <text x="412" y="330" font-family="Arial" font-size="14" fill="#374151">이용자 간의 권리·의무 및 책임사항을 규정함을 목적으로 합니다.</text>

  <text x="412" y="384" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">제2조 (용어의 정의)</text>
  <text x="412" y="414" font-family="Arial" font-size="14" fill="#374151">1. "당사자"란 본 서비스에 생애기록이 관리되는 발달장애인 본인을</text>
  <text x="412" y="438" font-family="Arial" font-size="14" fill="#374151">   말합니다.</text>
  <text x="412" y="462" font-family="Arial" font-size="14" fill="#374151">2. "보호자"란 당사자를 대리하여 계정과 권한을 관리하는 가족·후견인을</text>
  <text x="412" y="486" font-family="Arial" font-size="14" fill="#374151">   말합니다.</text>
  <text x="412" y="510" font-family="Arial" font-size="14" fill="#374151">3. "이해관계자"란 보호자가 권한을 부여한 전문가(교사·복지사 등)를</text>
  <text x="412" y="534" font-family="Arial" font-size="14" fill="#374151">   말합니다.</text>

  <text x="412" y="588" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">제3조 (약관의 효력 및 변경)</text>
  <text x="412" y="618" font-family="Arial" font-size="14" fill="#374151">회사는 약관을 변경할 경우 시행일 7일 전(이용자에게 불리한 변경은</text>
  <text x="412" y="642" font-family="Arial" font-size="14" fill="#374151">30일 전)부터 서비스 내 공지하며, 동의한 버전과 다를 경우 재동의를</text>
  <text x="412" y="666" font-family="Arial" font-size="14" fill="#374151">요청합니다. (동의 버전 추적: 본 약관 v1.2)</text>
  <text x="412" y="712" font-family="Arial" font-size="13" fill="#9CA3AF">… 이하 본문 계속 (스크롤) …</text>

  <!-- Sticky footer: back -->
