  <rect x="40" y="260" width="4" height="36" fill="#3B7D8E"/>
  <text x="64" y="283" font-family="Arial" font-size="13" font-weight="bold" fill="#2E5FA8">제1조 (목적)</text>
  <text x="64" y="324" font-family="Arial" font-size="13" fill="#6B7280">제2조 (용어의 정의)</text>
  <text x="64" y="358" font-family="Arial" font-size="13" fill="#6B7280">제3조 (약관의 효력·변경)</text>
  <text x="64" y="392" font-family="Arial" font-size="13" fill="#6B7280">제4조 (이용계약의 성립)</text>
  <text x="64" y="426" font-family="Arial" font-size="13" fill="#6B7280">제5조 (서비스의 제공)</text>
  <text x="64" y="460" font-family="Arial" font-size="13" fill="#6B7280">제6조 (회원의 의무)</text>
  <text x="64" y="494" font-family="Arial" font-size="13" fill="#6B7280">제7조 (대리동의·권한)</text>
  <text x="64" y="528" font-family="Arial" font-size="13" fill="#6B7280">제8조 (계약 해지·탈퇴)</text>
  <text x="64" y="562" font-family="Arial" font-size="13" fill="#6B7280">제9조 (면책 조항)</text>
