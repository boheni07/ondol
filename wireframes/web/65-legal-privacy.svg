  <!-- Main article -->
  <rect x="380" y="208" width="1020" height="568" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="412" y="252" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">1. 수집하는 개인정보 항목</text>
  <text x="412" y="282" font-family="Arial" font-size="14" fill="#374151">회사는 서비스 제공을 위해 아래의 개인정보를 항목별 동의를 받아</text>
  <text x="412" y="306" font-family="Arial" font-size="14" fill="#374151">수집합니다. 각 항목은 PIPA §22⑤에 따라 분리하여 동의받습니다.</text>

