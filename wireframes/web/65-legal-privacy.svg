  <text x="412" y="516" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">3. 민감정보·고유식별정보 처리</text>
  <text x="412" y="546" font-family="Arial" font-size="14" fill="#374151">회사는 장애·건강 정보 등 민감정보를 회원가입 시 별도 동의를 받아</text>
