<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- G-65 · ST-11 Guardian Privacy & Consent Mgmt · Web 1440×900 -->
  <text x="8" y="14" font-family="Arial" font-size="10" fill="#9CA3AF">G-65 · ST-11 Guardian Privacy &amp; Consent Management · Web 1440×900</text>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- SIDEBAR -->
  <rect width="240" height="900" fill="#F5F5F5"/>
  <rect width="240" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="240" y2="64" stroke="#E5E7EB"/>
  <text x="24" y="42" font-family="Arial" font-size="18" font-weight="bold" fill="#3B7D8E">온돌</text>
  <text x="52" y="123" font-family="Arial" font-size="13" fill="#374151">홈</text>
  <text x="52" y="167" font-family="Arial" font-size="13" fill="#374151">타임라인</text>
  <text x="52" y="211" font-family="Arial" font-size="13" fill="#374151">기록 관리</text>
  <text x="52" y="255" font-family="Arial" font-size="13" fill="#374151">권한 관리</text>
  <text x="52" y="299" font-family="Arial" font-size="13" fill="#374151">알림</text>
  <!-- Settings active -->
  <rect y="324" width="240" height="44" fill="#EEF4FD"/>
  <rect y="324" width="3" height="44" fill="#3B7D8E"/>
  <text x="52" y="351" font-family="Arial" font-size="13" font-weight="bold" fill="#2E5FA8">설정</text>
  <circle cx="32" cy="864" r="18" fill="#3B7D8E"/>
  <text x="32" y="870" text-anchor="middle" font-family="Arial" font-size="12" fill="white">김</text>
  <text x="58" y="864" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">김보호자</text>

  <!-- HEADER -->
  <rect x="240" width="1200" height="64" fill="#FFFFFF"/>
  <line x1="240" y1="64" x2="1440" y2="64" stroke="#E5E7EB"/>
  <text x="272" y="30" font-family="Arial" font-size="11" fill="#9CA3AF">설정 / 개인정보·동의 관리</text>
  <text x="272" y="50" font-family="Arial" font-size="15" font-weight="bold" fill="#111827">개인정보·동의 관리</text>

  <!-- Settings sub-nav -->
  <rect x="240" y="64" width="220" height="836" fill="#FAFAFA"/>
  <line x1="460" y1="64" x2="460" y2="900" stroke="#E5E7EB"/>
  <text x="272" y="110" font-family="Arial" font-size="11" font-weight="bold" fill="#9CA3AF">설정</text>
  <text x="272" y="148" font-family="Arial" font-size="13" fill="#6B7280">내 프로필</text>
  <text x="272" y="186" font-family="Arial" font-size="13" fill="#6B7280">당사자 정보</text>
  <text x="272" y="224" font-family="Arial" font-size="13" fill="#6B7280">알림 설정</text>
  <rect x="240" y="240" width="220" height="36" fill="#EEF4FD"/>
  <rect x="240" y="240" width="3" height="36" fill="#3B7D8E"/>
  <text x="272" y="263" font-family="Arial" font-size="13" font-weight="bold" fill="#2E5FA8">개인정보·동의 관리</text>
  <text x="272" y="301" font-family="Arial" font-size="13" fill="#6B7280">보안</text>

  <!-- MAIN -->
  <text x="500" y="116" font-family="Arial" font-size="24" font-weight="bold" fill="#111827">동의 현황</text>
  <text x="500" y="142" font-family="Arial" font-size="13" fill="#6B7280">수집된 동의 내역을 확인하고 선택 항목을 철회할 수 있습니다 (PIPA 권리행사)</text>

  <!-- 대리/본인 탭: 당사자별 -->
  <rect x="500" y="160" width="160" height="40" rx="8" fill="#3B7D8E"/>
  <text x="580" y="185" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">대리동의 · 김온돌</text>
  <rect x="668" y="160" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="728" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#6B7280">내 계정 동의</text>

  <!-- Consent list card -->
  <rect x="500" y="220" width="908" height="380" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <!-- column header -->
  <rect x="500" y="220" width="908" height="40" rx="14" fill="#F9FAFB"/>
  <text x="524" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">항목</text>
  <text x="900" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">구분</text>
  <text x="1040" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">상태 · 일시</text>
  <text x="1384" y="245" text-anchor="end" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">관리</text>

  <!-- Row 1: 이용약관 (필수) -->
  <text x="524" y="294" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">이용약관</text>
  <rect x="888" y="282" width="44" height="20" rx="5" fill="#FDECEC"/>
  <text x="910" y="296" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C0362C">필수</text>
  <text x="1040" y="294" font-family="Arial" font-size="13" fill="#22A06B">동의함 · 2026-06-14</text>
  <text x="1384" y="294" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 ›</text>
  <text x="1040" y="312" font-family="Arial" font-size="11" fill="#9CA3AF">철회 불가 (회원 탈퇴 시 처리)</text>
  <line x1="500" y1="328" x2="1408" y2="328" stroke="#F3F4F6"/>

  <!-- Row 2: 개인정보(필수) -->
  <text x="524" y="360" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">개인정보 수집·이용</text>
  <rect x="888" y="348" width="44" height="20" rx="5" fill="#FDECEC"/>
  <text x="910" y="362" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C0362C">필수</text>
  <text x="1040" y="360" font-family="Arial" font-size="13" fill="#22A06B">동의함 · 2026-06-14</text>
  <text x="1384" y="360" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">전문 ›</text>
  <line x1="500" y1="384" x2="1408" y2="384" stroke="#F3F4F6"/>

  <!-- Row 3: 마케팅 (선택, Toggle on) -->
  <text x="524" y="416" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">마케팅·알림 수신</text>
  <rect x="888" y="404" width="44" height="20" rx="5" fill="#F3F4F6"/>
  <text x="910" y="418" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#6B7280">선택</text>
  <text x="1040" y="416" font-family="Arial" font-size="13" fill="#6B7280">동의함 · 2026-06-14</text>
  <!-- Toggle on -->
  <rect x="1336" y="404" width="48" height="26" rx="13" fill="#3B7D8E"/>
  <circle cx="1371" cy="417" r="10" fill="white"/>
  <line x1="500" y1="448" x2="1408" y2="448" stroke="#F3F4F6"/>

  <!-- Row 4: 위탁·국외이전 (고지) -->
  <text x="524" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">처리위탁·국외이전</text>
  <rect x="888" y="468" width="44" height="20" rx="5" fill="#EEF4FD"/>
  <text x="910" y="482" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2E5FA8">고지</text>
  <text x="1040" y="480" font-family="Arial" font-size="13" fill="#6B7280">고지 확인 · 2026-06-14</text>
  <text x="1384" y="480" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">고지 ›</text>
  <line x1="500" y1="504" x2="1408" y2="504" stroke="#F3F4F6"/>

  <!-- Row 5: 민감정보 (별도, 철회 버튼) -->
  <text x="524" y="536" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">민감정보 (장애·건강)</text>
  <rect x="888" y="524" width="44" height="20" rx="5" fill="#FEF3C7"/>
  <text x="910" y="538" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#92670D">별도</text>
  <text x="1040" y="536" font-family="Arial" font-size="13" fill="#22A06B">동의함 · 2026-06-14</text>
  <rect x="1300" y="520" width="84" height="30" rx="8" fill="#FFFFFF" stroke="#BF3030"/>
  <text x="1342" y="540" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#BF3030">철회</text>
  <line x1="500" y1="560" x2="1408" y2="560" stroke="#F3F4F6"/>

  <!-- Row 6: 고유식별 (미수집) -->
  <text x="524" y="588" font-family="Arial" font-size="14" font-weight="bold" fill="#111827">고유식별정보 (등록번호)</text>
  <rect x="888" y="576" width="44" height="20" rx="5" fill="#FEF3C7"/>
  <text x="910" y="590" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#92670D">별도</text>
  <text x="1040" y="588" font-family="Arial" font-size="13" fill="#9CA3AF">미수집</text>
  <text x="1384" y="588" text-anchor="end" font-family="Arial" font-size="13" fill="#3B7D8E">지금 동의 ›</text>

  <!-- 철회 경고 confirm 미니 모달 미리보기 -->
  <rect x="500" y="624" width="908" height="84" rx="12" fill="#FDF6F6" stroke="#E8A9A9"/>
  <text x="524" y="654" font-family="Arial" font-size="13" font-weight="bold" fill="#BF3030">⚠ 민감정보 동의 철회 시</text>
  <text x="524" y="678" font-family="Arial" font-size="12" fill="#6B7280">의료·건강 등 핵심 기록 기능 이용이 제한됩니다. 철회는 즉시 처리정지로 반영됩니다.</text>
  <text x="524" y="696" font-family="Arial" font-size="12" fill="#9CA3AF">철회 시 확인 모달이 한 번 더 표시됩니다.</text>

  <!-- 데이터 내보내기 -->
  <rect x="500" y="730" width="908" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="524" y="768" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">내 데이터 내보내기</text>
  <text x="524" y="792" font-family="Arial" font-size="13" fill="#6B7280">전송요구권(§35-2)에 따라 보관 중인 기록을 CSV/PDF로 받습니다. 생성 완료 시 알림으로 안내합니다.</text>
  <rect x="1238" y="752" width="146" height="48" rx="10" fill="#FFFFFF" stroke="#3B7D8E"/>
  <text x="1311" y="782" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3B7D8E">내보내기 (CSV/PDF)</text>
</svg>
